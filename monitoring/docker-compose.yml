# Monitoring stack on the shared network (created by ../infra: `make network`).
# Settings come from .env (see .env.example). Exporters have no published ports:
# Prometheus scrapes them over shared-net.

name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks: [shared]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [shared]
    restart: unless-stopped

  # Native MySQL on the VPS, reached through the host gateway.
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    command:
      - "--mysqld.username=${MYSQL_USER:?set MYSQL_USER in .env}"
      - "--mysqld.address=${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    networks: [shared]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Host metrics: host network + host PID, so it does not join shared-net.
  # Prometheus reaches it at host.docker.internal:9100.
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    pid: "host"
    network_mode: "host"
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
    restart: unless-stopped

  # Native nginx on the VPS (stub_status on port 9114).
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "-nginx.scrape-uri=http://host.docker.internal:9114/nginx_status"
    networks: [shared]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: shared-postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD in .env (make pg-monitor-user in ../infra)}
    # Both collectors are off by default; the PostgreSQL dashboard needs them
    # (start time, and checkpoint stats that Postgres 17 moved out of pg_stat_bgwriter).
    command:
      - "--collector.postmaster"
      - "--collector.stat_checkpointer"
    networks: [shared]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://shared-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (same value as ../infra/.env)}
    networks: [shared]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana-data:

networks:
  shared:
    name: ${SHARED_NETWORK:-shared-net}
    external: true
