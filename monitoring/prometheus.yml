global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 15s

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Garage serves /metrics itself on the admin port; the bearer token is
  # GARAGE_METRICS_TOKEN from ../infra/.env, copied to secrets/garage_metrics_token.
  - job_name: 'garage'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/garage_metrics_token
    static_configs:
      - targets: ['shared-garage:3903']
