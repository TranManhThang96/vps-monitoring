# Agent playground: n8n, OpenClaw gateway and Hermes agent.
# All settings come from .env (see .env.example). Manage with `make help`.
#
# Every web UI binds to 127.0.0.1 and is published by the host's native nginx.
# The containers join `agent-net` (fixed subnet, so PROXY_IP is stable) and n8n
# also joins the shared infra network to reach shared-postgres.
#
# Other apps reach these services by container name: agent-n8n:5678,
# openclaw-gateway:18789, hermes:9119, hermes:8642.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: agent

services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.47.7}
    container_name: agent-n8n
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      # Public URL behind the host nginx. N8N_WEBHOOK_URL must be set explicitly:
      # n8n would otherwise append :5678 to the webhook base URL.
      N8N_HOST: ${N8N_HOST:-n8n.example.com}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.example.com/}
      # Reverse proxies in front of n8n: nginx only, or nginx + Cloudflare proxy.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-2}
      # Losing this key loses every stored credential. It is generated by `make init`.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env (make init)}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${SHARED_POSTGRES_HOST:-shared-postgres}
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env (make init)}
    volumes:
      - ${DATA_DIR:-./data}/n8n:/home/node/.n8n
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    networks: [default, shared]
    mem_limit: ${N8N_MEM_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", 'node -e "fetch(''http://127.0.0.1:5678/healthz'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.11.3}
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side paths so host paths from .env never leak in.
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env (make init)}
      # mDNS multicast does not pass through the Docker bridge.
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${DATA_DIR:-./data}/openclaw:/home/node/.openclaw
      - ${DATA_DIR:-./data}/openclaw-auth-profile-secrets:/home/node/.config/openclaw
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OPENCLAW_HOST_PORT:-18789}:18789"
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789", "--allow-unconfigured"]
    networks: [default]
    mem_limit: ${OPENCLAW_MEM_LIMIT:-3g}
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-off CLI: `make openclaw-cli CMD="devices list"`.
  # Shares the gateway's network and PID namespace; never started by `make up`.
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.11.3}
    profiles: ["cli"]
    network_mode: "service:openclaw-gateway"
    pid: "service:openclaw-gateway"
    depends_on:
      - openclaw-gateway
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env (make init)}
      BROWSER: echo
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${DATA_DIR:-./data}/openclaw:/home/node/.openclaw
      - ${DATA_DIR:-./data}/openclaw-auth-profile-secrets:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:0.23.1}
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # The dashboard refuses to start on a non-loopback bind without an auth
      # provider, so basic auth is mandatory here.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD in .env (make init)}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?set HERMES_DASHBOARD_SECRET in .env (make init)}
      # The OpenAI-compatible API server is always on in this image; the key
      # is generated into data/hermes/.env on first boot. Published on
      # loopback only, see README.
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
    volumes:
      - ${DATA_DIR:-./data}/hermes:/opt/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
      - "${BIND_ADDR:-127.0.0.1}:${HERMES_API_HOST_PORT:-8642}:8642"
    networks: [default]
    mem_limit: ${HERMES_MEM_LIMIT:-4g}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      # TCP probe: the dashboard answers 401 for unauthenticated HTTP requests.
      test: ["CMD-SHELL", "python3 -c 'import socket; socket.create_connection((\"127.0.0.1\", 9119), 3)'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  # Fixed subnet so the host nginx reaches containers from a known address
  # (PROXY_IP in .env). OpenClaw and Hermes reject forwarded headers from
  # unknown proxies.
  default:
    name: agent-net
    ipam:
      config:
        - subnet: ${AGENT_SUBNET:-192.168.32.0/24}
  shared:
    name: ${SHARED_NETWORK:-shared-net}
    external: true
